<!DOCTYPE html>
<html>
<head>
    <title>IXL Key Manager</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; }
        .tab { overflow: hidden; border-bottom: 1px solid #ccc; margin-bottom: 20px; }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 16px;
            transition: 0.3s;
            font-size: 16px;
            color: #000;               /* <-- BLACK TAB TEXT */
        }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; color: #000; }
        .tabcontent { display: none; padding: 6px 12px; }
        .row { margin: 15px 0; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #000; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2980b9; }
        #keyOutput { background: #eaf2f8; padding: 10px; border-radius: 5px; word-break: break-all; font-family: monospace; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; color: #000; }
        th { background-color: #f2f2f2; }
        .revoked { color: red; }
        .expired { color: orange; }
        .active { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>IXL Key Manager</h1>
        <div id="loginSection">
            <div class="row"><label>Username</label><input type="text" id="username" placeholder="admin"></div>
            <div class="row"><label>Password</label><input type="password" id="password" placeholder="password"></div>
            <button onclick="login()">Login</button>
            <p class="error" id="loginError"></p>
        </div>
        <div id="mainSection" style="display:none;">
            <div class="tab">
                <button class="tablinks active" onclick="openTab(event, 'generator')">Generate Key</button>
                <button class="tablinks" onclick="openTab(event, 'history')">Key History</button>
                <button class="tablinks" onclick="openTab(event, 'settings')">Settings</button>
            </div>
            <div id="generator" class="tabcontent" style="display:block;">
                <div class="row"><label>Duration</label><input type="number" id="duration" value="1" min="1"></div>
                <div class="row"><label>Unit</label><select id="unit"><option value="minutes">Minutes</option><option value="hours">Hours</option><option value="days">Days</option></select></div>
                <button onclick="generateKey()">Generate Key</button>
                <div id="keyOutput"></div>
            </div>
            <div id="history" class="tabcontent">
                <h3>Generated Keys</h3>
                <table id="keyTable"><tr><th>ID (short)</th><th>Created</th><th>Duration</th><th>Status</th><th>Action</th></tr></table>
                <button onclick="refreshHistory()">Refresh</button>
            </div>
            <div id="settings" class="tabcontent">
                <h3>Change Credentials</h3>
                <p><i>For production, change the ADMIN_USER and ADMIN_PASS in server.js and restart.</i></p>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken') || '';

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            authToken = btoa(`${u}:${p}`);
            localStorage.setItem('authToken', authToken);
            showMain();
        }

        function showMain() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mainSection').style.display = 'block';
            refreshHistory();
        }

        function openTab(evt, tabName) {
            const tabcontent = document.getElementsByClassName('tabcontent');
            for (let i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = 'none';
            const tablinks = document.getElementsByClassName('tablinks');
            for (let i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(' active', '');
            document.getElementById(tabName).style.display = 'block';
            evt.currentTarget.className += ' active';
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            const headers = { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' };
            const res = await fetch(endpoint, { method, headers, body: body ? JSON.stringify(body) : null });
            if (res.status === 401) { alert('Unauthorized'); return null; }
            return await res.json();
        }

        async function generateKey() {
            const duration = parseInt(document.getElementById('duration').value);
            const unit = document.getElementById('unit').value;
            if (!duration || duration < 1) { alert('Enter valid duration'); return; }
            const msPerUnit = { minutes: 60000, hours: 3600000, days: 86400000 };
            const durationMs = duration * msPerUnit[unit];
            const result = await apiRequest('/api/generate-key', 'POST', { durationMs });
            if (result && result.key) {
                document.getElementById('keyOutput').innerHTML = `<strong>Your key:</strong><br>${result.key}`;
                refreshHistory();
            } else {
                alert('Error generating key');
            }
        }

        async function refreshHistory() {
            const keys = await apiRequest('/api/keys');
            if (!keys) return;
            const table = document.getElementById('keyTable');
            table.innerHTML = '<tr><th>ID (short)</th><th>Created</th><th>Duration</th><th>Status</th><th>Action</th></tr>';
            keys.forEach(k => {
                const row = table.insertRow();
                const status = k.revoked ? 'revoked' : (k.status === 'expired' ? 'expired' : 'active');
                row.innerHTML = `<td>${k.id.slice(0,8)}...</td><td>${new Date(k.created).toLocaleString()}</td><td>${(k.duration/60000).toFixed(0)} min</td><td class="${status}">${status}</td><td>${k.revoked ? '' : `<button onclick="revokeKey('${k.id}')">Delete</button>`}</td>`;
            });
        }

        async function revokeKey(id) {
            await apiRequest('/api/revoke-key', 'POST', { keyId: id });
            refreshHistory();
        }

        if (authToken) showMain();
    </script>
</body>
</html>
